<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - Zhejiang Community Charity Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a id="back-to-details-link" href="index.html" class="back-link">&larr; Back to Event Details</a>
            <h1>Event Registration Form</h1>
        </div>
    </header>

    <main class="container">
        <div class="form-card">
            <h2 id="event-title-display">Registering for Event...</h2>
            <p id="feedback-msg" class="form-response-msg" hidden></p>

            <form id="registration-form">
                <!-- Hidden Event ID Field -->
                <input type="hidden" id="event_id" name="event_id" value="">

                <div class="form-group">
                    <label for="user_name">Full Name <span class="required">*</span></label>
                    <input type="text" id="user_name" name="user_name" required placeholder="e.g. John Doe">
                    <p class="form-hint">Each participant name can only be registered once per event.</p>
                </div>

                <div class="form-group">
                    <label for="user_email">Email Address <span class="required">*</span></label>
                    <input type="email" id="user_email" name="user_email" required placeholder="e.g. johndoe@example.com">
                </div>

                <div class="form-group">
                    <label for="contact_number">Contact Phone Number <span class="required">*</span></label>
                    <input type="tel" id="contact_number" name="contact_number" required placeholder="e.g. 0412345678">
                </div>

                <div class="form-group">
                    <label for="tickets_purchased">Number of Tickets <span class="required">*</span></label>
                    <input type="number" id="tickets_purchased" name="tickets_purchased" min="1" max="10" value="1" required>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">Submit Registration</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Zhejiang Community Charity Events Platform | PROG2002 Assessment 3</p>
    </footer>

    <script src="registration.js"></script>
</body>
</html>
